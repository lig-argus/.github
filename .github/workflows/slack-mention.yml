# 위치: lig-argus/.github 저장소의 .github/workflows/slack-mention.yml
# "누가 지금 뭘 해야 하는지"만 담당 → 항상 사람을 멘션하는 알림만 보냄
# (일반 소식 피드는 /github subscribe 가 담당)
name: Slack mentions (reusable)

on:
  workflow_call:
    inputs:
      user_map:
        description: 'GitHub 아이디 → Slack 멤버 ID JSON'
        type: string
        required: false
        default: '{}'

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Slack message
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          USER_MAP: ${{ inputs.user_map }}
          EVENT_NAME: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          REPO: ${{ github.repository }}
          SENDER: ${{ github.event.sender.login }}
          # PR
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          REVIEWER: ${{ github.event.requested_reviewer.login }}
          TEAM: ${{ github.event.requested_team.slug }}
          REVIEW_USER: ${{ github.event.review.user.login }}
          REVIEW_STATE: ${{ github.event.review.state }}
          # 이슈 / 담당자
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ASSIGNEE: ${{ github.event.assignee.login }}
          # 코멘트
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_URL: ${{ github.event.comment.html_url }}
          COMMENT_USER: ${{ github.event.comment.user.login }}
          COMMENT_USER_TYPE: ${{ github.event.comment.user.type }}
          # CI
          WR_NAME: ${{ github.event.workflow_run.name }}
          WR_URL: ${{ github.event.workflow_run.html_url }}
          WR_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WR_ACTOR: ${{ github.event.workflow_run.actor.login }}
          WR_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "::error::SLACK_WEBHOOK_URL 시크릿이 없습니다 (조직 시크릿의 저장소 접근 권한 확인)"
            exit 1
          fi

          MAP="${USER_MAP:-}"
          [ -z "$MAP" ] && MAP='{}'
          REPO_NAME="${REPO##*/}"

          slack_id() { jq -r --arg k "$1" '.[$k] // empty' <<<"$MAP"; }
          mention() {
            local id; id=$(slack_id "$1")
            if [ -n "$id" ]; then echo "<@$id>"; else echo "@$1"; fi
          }
          team_mention() {
            local id; id=$(slack_id "team:$1")
            if [ -n "$id" ]; then echo "<!subteam^$id>"; else echo "@$1 팀"; fi
          }
          esc() { jq -rn --arg s "$1" '$s | gsub("&";"&amp;") | gsub("<";"&lt;") | gsub(">";"&gt;")'; }

          TITLE="${PR_TITLE:-$ISSUE_TITLE}"
          NUMBER="${PR_NUMBER:-$ISSUE_NUMBER}"
          URL="${PR_URL:-$ISSUE_URL}"
          LINK="<${URL}|${REPO_NAME}#${NUMBER} $(esc "$TITLE")>"
          TEXT=""

          case "$EVENT_NAME:$ACTION" in

            # 1) 리뷰어 지정 → 리뷰어 멘션
            pull_request_target:review_requested)
              if [ -n "$REVIEWER" ]; then WHO=$(mention "$REVIEWER"); else WHO=$(team_mention "$TEAM"); fi
              TEXT="👀 ${WHO} 리뷰 요청이 왔어요: ${LINK} (작성자: ${PR_AUTHOR})"
              ;;

            # 2) 리뷰 제출 → PR 작성자 멘션
            pull_request_review:submitted)
              [ "$REVIEW_USER" = "$PR_AUTHOR" ] && exit 0
              case "$REVIEW_STATE" in
                approved)          STATE="✅ 승인했어요" ;;
                changes_requested) STATE="🛠️ 변경을 요청했어요" ;;
                *)                 STATE="💬 리뷰 코멘트를 남겼어요" ;;
              esac
              TEXT="$(mention "$PR_AUTHOR") ${REVIEW_USER} 님이 ${STATE}: ${LINK}"
              ;;

            # 3) 이슈·PR 담당자 지정 → 담당자 멘션 (스스로 지정한 경우 제외)
            pull_request_target:assigned|issues:assigned)
              [ "$ASSIGNEE" = "$SENDER" ] && exit 0
              KIND="이슈"; [ "$EVENT_NAME" = "pull_request_target" ] && KIND="PR"
              TEXT="📌
